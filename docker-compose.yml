services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: markdox-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: markdox-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
